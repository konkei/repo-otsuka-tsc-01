name: Deploy Azure VNet

on:
  workflow_dispatch:
    inputs:
      subscriptionId:
        description: 'Target Azure Subscription ID'
        required: true
        type: string

      resourceGroup:
        description: 'Target Resource Group'
        required: true
        default: 'rg-16427-git'
        type: string

      location:
        description: 'Azure Region'
        required: true
        default: 'japaneast'
        type: choice
        options:
          - japaneast
          - japanwest

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deployment variables
        run: |
          SUBSCRIPTION_ID="${{ inputs.subscriptionId }}"
          TEMPLATE_FILE="infra/azure-vnet.bicep"
          PARAMETER_FILE="parameters/${SUBSCRIPTION_ID}/azure-vnet.bicepparam"

          echo "SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "TEMPLATE_FILE=$TEMPLATE_FILE" >> $GITHUB_ENV
          echo "PARAMETER_FILE=$PARAMETER_FILE" >> $GITHUB_ENV

      - name: Check files
        run: |
          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "Template file not found: $TEMPLATE_FILE"
            exit 1
          fi

          if [ ! -f "$PARAMETER_FILE" ]; then
            echo "Parameter file not found: $PARAMETER_FILE"
            exit 1
          fi

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscriptionId }}

      - name: Deploy VNet
        run: |
          az deployment group create \
            --resource-group "${{ inputs.resourceGroup }}" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETER_FILE" \
            --parameters location="${{ inputs.location }}"